version: '3.8'
services:
  ba-modding-toolkit-web:
    build:
      context: .
      args:
        GIT_TAG: ${GIT_TAG:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: jacksen168/ba-modding-toolkit-web:latest
    container_name: ba-modding-toolkit-web
    network_mode: bridge
    ports:
      - "8200:80"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      # Optional: custom upload filename black/whitelist rules.
      # Create ./data/upload-rules.json on the host (see example below) and
      # the backend will load it on startup / first upload.
      #   - ./data/upload-rules.json:/app/data/upload-rules.json:ro
    environment:
      - DATABASE_URL=sqlite:///./data/bamt.db
      - DEBUG=false
      # Path to the upload rules JSON file. Relative paths resolve to /app.
      # Leave empty to use built-in default rules (allow bundle/png/skel/atlas).
      - UPLOAD_RULES_FILE=/app/data/upload-rules.json
      # Status page (/status) reports the container's own resource limits by
      # reading the cgroup, rather than the host's totals. Set to false to
      # always report host-wide figures.
      - STATUS_CONTAINER_AWARE=true
      # Hide individual parts of /api/status (and the /status page) from
      # visitors who should not learn the host's hardware or traffic. Any of:
      #   cpu memory disk paths host container process version uptime
      #   tasks performance activity queue storage sessions
      # plus the shorthands "system" (= cpu,memory,disk) and "all".
      # Default is to hide nothing.
      # - STATUS_REDACT=cpu,memory,disk,paths
      # CORS settings (optional, defaults to allow all origins)
      # - CORS_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
      # - CORS_ALLOW_CREDENTIALS=true
      # - CORS_ALLOW_METHODS=GET,POST,DELETE
      # - CORS_ALLOW_HEADERS=Content-Type,Authorization
    # Optional: cap the service so STATUS_CONTAINER_AWARE has limits to report.
    # Without these the status page shows the whole host's CPU and memory.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2.0"
    #       memory: 4g
    restart: unless-stopped
